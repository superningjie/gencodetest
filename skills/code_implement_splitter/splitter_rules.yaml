# 需求拆分规则 V3.0
# 支持金蝶云苍穹插件开发规则

# 导入金蝶插件专用规则
imports:
  - kingdee_plugin_rules.yaml

splitting_rules:
  # 规则1：原子性检查
  atomicity_check:
    enabled: true
    max_description_length: 500
    required_fields: ["function", "input", "output", "tech_stack"]

  # 规则2：技术栈推断 (增强版)
  tech_stack_inference:
    enabled: true
    rules:
      # 金蝶云苍穹插件开发
      - pattern: "单据插件|表单插件|操作插件|列表插件|转换插件|金蝶|苍穹|星瀚|KingScript|plugin"
        stack: "kingdee_plugin"
        language: "typescript"  # KingScript 基于 TypeScript
        impl_type: "kingdee_plugin"
        framework: "cosmic-bos"

      - pattern: "报表|统计|查询|数据"
        stack: "sql_report"
        language: "sql"
        impl_type: "sql_report"

      - pattern: "接口|API|服务|controller|rest"
        stack: "java_api"
        language: "java"
        impl_type: "java_api"

      - pattern: "Kotlin插件|kotlin.*plugin"
        stack: "kotlin_plugin"
        language: "kotlin"
        impl_type: "kotlin_plugin"

      - pattern: "脚本|自动化|定时任务"
        stack: "python_script"
        language: "python"
        impl_type: "python_script"

      - pattern: "配置|参数|规则"
        stack: "configuration"
        language: "yaml"
        impl_type: "configuration"

  # 规则3：模块识别
  module_detection:
    mapping:
      - keywords: ["考勤", "打卡", "排班", "假期", "出勤"]
        module: "HR_ATTENDANCE"

      - keywords: ["薪酬", "工资", "社保", "公积金", "个税", "薪资", "发薪"]
        module: "HR_PAYROLL"

      - keywords: ["组织", "员工", "合同", "档案", "人事", "入职", "离职"]
        module: "HR_CORE"

      - keywords: ["招聘", "面试", "入职", "简历", "候选人"]
        module: "HR_RECRUITMENT"

      - keywords: ["绩效", "考核", "目标", "KPI", "OKR"]
        module: "HR_PERFORMANCE"

      - keywords: ["培训", "学习", "课程", "考试"]
        module: "HR_TRAINING"

  # 规则4：复杂度评估
  complexity_assessment:
    factors:
      - name: "description_length"
        weight: 0.2
        thresholds:
          low: 50
          medium: 200
          high: 500

      - name: "dependency_count"
        weight: 0.3
        thresholds:
          low: 1
          medium: 3
          high: 5

      - name: "business_rules"
        weight: 0.5
        thresholds:
          low: 2
          medium: 5
          high: 10

      - name: "event_count"
        weight: 0.4
        thresholds:
          low: 1
          medium: 3
          high: 6

  # 规则5：扩展点映射
  extension_point_mapping:
    HR_ATTENDANCE:
      - keyword: "打卡"
        point_id: "attendance_check_in"
        interface: "ICheckInValidator"

      - keyword: "请假"
        point_id: "attendance_leave"
        interface: "ILeaveApprover"

      - keyword: "加班"
        point_id: "attendance_overtime"
        interface: "IOvertimeCalculator"

    HR_PAYROLL:
      - keyword: "计算"
        point_id: "payroll_calculation"
        interface: "ISalaryCalculator"

      - keyword: "发放"
        point_id: "payroll_distribution"
        interface: "IPaymentProcessor"

  # 规则6：金蝶插件专用扩展点
  kingdee_extension_points:
    enabled: true
    plugin_types:
      bill_form:
        registration_location: "表单设计器 > 插件 > 注册"
        common_events:
          - afterCreateNewData
          - afterLoadData
          - afterBindData
          - propertyChanged
          - beforeDoOperation
          - afterDoOperation
          
      operation:
        registration_location: "业务服务 > 操作服务 > 插件"
        common_events:
          - onPreparePropertys
          - beforeExecuteOperationTransaction
          - afterExecuteOperationTransaction
          - onAddValidators
          
      list:
        registration_location: "单据列表 > 插件"
        common_events:
          - setFilter
          - beforeShowBill
          - packageData
          
      convert:
        registration_location: "业务流 > 转换路线 > 插件"
        common_events:
          - beforeGetSourceData
          - afterFieldMapping
          - afterConvert
